<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Image Processing</title>
    <style>
      body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Arial', sans-serif;
      }
      .navbar {
        z-index: 1;
      }
      .main-container {
        display: flex;
        height: calc(100vh - 70px); /* Exclude navbar height */
      }
      .sidebar {
        width: 30%;
        background-color: #1f1f1f;
        padding: 20px;
        overflow-y: auto;
        border-right: 2px solid #6c757d;
      }
      .content-area {
        width: 70%;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .content-area img {
        max-width: 100%;
        max-height: 100%;
        border-radius: 10px;
      }
      label {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">
          <i class="bi bi-aspect-ratio"></i> Image Processing
        </a>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Sidebar -->
      <div class="sidebar">
        <h4 class="text-center mb-4">Image Processing Options</h4>
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3">
            <label for="imageInput" class="form-label">Upload Image</label>
            <input type="file" class="form-control" id="imageInput" name="image" required accept="image/*">
          </div>
          <button type="submit" name="action" value="grayscale" class="btn btn-primary w-100">Convert to Grayscale</button>
        </form>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        {% if processed_image_url %}
          <img id="previewImage" src="{{ processed_image_url }}" alt="Processed Image">
          <a href="{{ download_link }}" download="grayscale_image.png" class="btn btn-success mt-3">Download Grayscale Image</a>
        {% else %}
          <img id="previewImage" src="https://via.placeholder.com/800x600" alt="Placeholder Image">
        {% endif %}
      </div>
    </div>

    <script>
      // JavaScript to handle dynamic image preview
      document.getElementById('imageInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
            const previewImage = document.getElementById('previewImage');
            previewImage.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
