{% extends 'base.html' %}

{% block mymessage %}
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #6a11cb, #2575fc);
    color: #ffffff;
    margin: 0;
    padding: 0;
  }

  .content {
    text-align: center;
    padding: 40px 0;
  }

  .content h1 {
    font-size: 2.5rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    margin-bottom: 10px;
  }

  .content p {
    font-size: 1rem;
    color: #f1f1f1;
    opacity: 0.9;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
  }

  .main-container {
    display: flex;
    justify-content: center;
    padding: 40px;
  }

  .form-container {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 15px;
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    padding: 30px;
    width: 100%;
    max-width: 400px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .form-container h4 {
    color: #fff;
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.5rem;
  }

  .form-label {
    font-size: 0.9rem;
    color: #f1f1f1;
  }

  .form-control {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    margin-top: 5px;
    font-size: 0.9rem;
  }

  .form-control:focus {
    outline: none;
    box-shadow: 0 0 5px #6a11cb;
  }

  .btn {
    background: linear-gradient(to right, #ff7e5f, #feb47b);
    color: #fff;
    border: none;
    padding: 10px 15px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 8px;
    margin-top: 10px;
    transition: all 0.3s ease-in-out;
  }

  .btn:hover {
    background: linear-gradient(to right, #feb47b, #ff7e5f);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    transform: translateY(-2px);
  }

  .image-preview {
    width: 100px;
    height: 100px;
    object-fit: cover;
    margin-top: 15px;
    border-radius: 10px;
    border: 2px solid #fff;
    display: none;
  }

  footer {
    text-align: center;
    padding: 20px 0;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    font-size: 0.8rem;
  }

  footer a {
    color: #ff7e5f;
    text-decoration: none;
    font-weight: bold;
  }

  footer a:hover {
    text-decoration: underline;
  }
</style>

<div class="container content">
  <h1>Welcome to FREE Image Converter!</h1>
  <p>Effortlessly compress and download your images in seconds.</p>
</div>

<div class="main-container">
  <div class="form-container">
    <h4>Compress Your Image</h4>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label for="imageInput" class="form-label">Upload Image (Max: 100 KB)</label>
        <input 
          type="file" 
          class="form-control" 
          id="imageInput" 
          name="image" 
          required 
          accept="image/*"
        >
        <img id="imagePreview" class="image-preview" alt="Uploaded Image">
      </div>
      <div class="mb-3">
        <label for="quantity" class="form-label">Compression Quality (1-100)</label>
        <input 
          type="number" 
          class="form-control" 
          id="quantity" 
          name="quantity" 
          min="1" 
          max="100" 
          required
        >
      </div>
      <button type="submit" class="btn w-100" name="compress">Compress & Download</button>
    </form>
  </div>
</div>

<footer>
  <p>&copy; 2025 FREE Image Converter. All rights reserved. <a href="#">Privacy Policy</a></p>
</footer>

<script>
  document.getElementById('imageInput').addEventListener('change', function(event) {
    const file = event.target.files[0];
    const preview = document.getElementById('imagePreview');

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  });
</script>
{% endblock %}
